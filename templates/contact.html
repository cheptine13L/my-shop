{% extends "base.html" %}

{% block title %}Contact - TechShop{% endblock %}

{% block content %}
<h2 class="mb-4">Contact</h2>

<div class="row">
    <div class="col-md-6">
        <h5>TechShop SRL</h5>
        <ul class="list-unstyled">
            <li>📍 Str. Mihai Eminescu nr. 42, Bucuresti, Romania</li>
            <li>📞 +40 721 000 000</li>
            <li>✉️ contact@techshop.ro</li>
            <li>🕐 Luni - Vineri: 09:00 - 18:00</li>
        </ul>
    </div>
    <div class="col-md-6">
        <h5>Trimite-ne un mesaj</h5>
        <form>
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Numele tau">
            </div>
            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3">
                <textarea class="form-control" rows="4" placeholder="Mesajul tau"></textarea>
            </div>
            <button class="btn btn-primary">Trimite</button>
        </form>
    </div>
</div>
{% endblock %}
